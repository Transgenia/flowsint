# TRANSGENIA · flowsint MCP · allowlist declarativa
# Fuente única de verdad para clasificar enrichers (LFPDPPP + ETHICS.md).
# Recarga automática via mtime (TTL 60 s) — no restart al editar.
# Flujo Valentina-PR + Kelsey-VoBo (Sprint 1, VoBo Saurat 2026-08-20).
#
# Regla estructural (allowlist_loader.classify_enricher):
#   1. name no está declarado    -> DENY (default-deny)
#   2. name en `forbidden`       -> DENY (mensaje claro)
#   3. entrada con pii_touched:true -> DENY (requiere re-autorización explícita)
#   4. input_type no en {Domain,Ip,Asn,Cidr,Organization,Website} -> DENY
#   5. resto -> ALLOW
#
# NOTA: los output_type de los enrichers upstream siguen la convención
# "<name>_to_<X>" con X derivado; verificar contra respuesta viva de
# /api/enrichers cuando la evidencia observable esté disponible.
---
version: 1
schema_notes:
  ttl_seconds_default: 300
  ttl_seconds_dns: 86400        # DNS/WHOIS son deterministas 24 h típicamente
  reviewed_at: "2026-08-20"

